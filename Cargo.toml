[package]
name = "ninjatracing"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"], optional = true }
anyhow = "1.0"
regex = "1.9"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "ninjatracing"
path = "src/main.rs"
required-features = ["cli"]
